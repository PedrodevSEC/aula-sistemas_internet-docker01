{% extends "base.html" %}

{% block content %}

<h1>Editar Aluno</h1>

<form method="POST">

    <label for="nome">Nome:</label>
    <input
        type="text"
        id="nome"
        name="nome"
        value="{{ aluno[1] }}"
        required
    >

    <br><br>

    <label for="email">E-mail:</label>
    <input
        type="email"
        id="email"
        name="email"
        value="{{ aluno[2] }}"
        required
    >

    <br><br>

    <button type="submit">Salvar alterações</button>

</form>

<br>

<a href="/alunos">Voltar para alunos</a>

{% endblock %}
